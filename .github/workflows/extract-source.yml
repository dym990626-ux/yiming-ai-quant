name: Extract tracked source for UI upgrade
on:
  push:
    paths:
      - '.github/workflows/extract-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive paths and extract
        shell: bash
        run: |
          python3 - <<'PY'
          import tarfile
          with tarfile.open('source.tar.gz','r:gz') as f:
              members=[]
              for m in f:
                  from pathlib import PurePosixPath
                  p=PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or not (m.isfile() or m.isdir()):
                      raise SystemExit(f'Unsafe entry: {m.name}')
                  if p.parts and p.parts[0] == 'src': members.append(m)
              if not members: raise SystemExit('Archive has no src files')
              f.extractall('.',members=members,filter='data')
          PY
          test -f src/main.tsx
          find src -type f | sort
      - name: Commit human-readable source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/
          if ! git diff --cached --quiet; then
            git commit -m "chore: expose existing src for direct UI development"
            git push
          fi
