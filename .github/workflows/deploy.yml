name: Deploy Yiming AI Quant to Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yiming-quant-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy divine-wood-aa20
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and type-check
        run: npm run build
      - name: Test server risk thresholds
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Validate D1 ledger migration locally
        run: python3 scripts/verify_migrations.py
      - name: Validate Cloudflare deploy secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."
            exit 1
          fi
      - name: Deploy existing Cloudflare Worker
        run: npx --yes wrangler@4 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Production HTTP smoke test
        continue-on-error: true # GitHub hosted runners may be geo/firewall blocked; the failure remains visible
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          base = "https://divine-wood-aa20.floral-sun-f603.workers.dev"
          for path, field in [("/api/bark/status","notificationEnabled"), ("/api/sim/status","serverExecutionEnabled")]:
              last = None
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(base + path, timeout=12) as response:
                          if response.status != 200:
                              raise ValueError("HTTP status " + str(response.status))
                          data = json.load(response)
                          if field not in data:
                              raise ValueError("Missing expected readiness field: " + field)
                          print("PASS", path, "readiness checked")
                          break
                  except Exception as error:
                      last = error
                      time.sleep(3)
              else:
                  print("::warning::GitHub runner could not externally verify " + path + ": " + str(last) + ". Cloudflare deploy passed; public endpoint remains unverified from this runner.")
          PY
