name: Verify build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate risk rules
        run: node --experimental-strip-types --test tests/risk-guard.test.mjs
      - name: Validate ledger migration without production writes
        run: python3 scripts/verify_migrations.py
